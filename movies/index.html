<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee — your movie shelf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<style>
:root{
  --bg:#0d0f14; --panel:#151924; --panel2:#1c2230; --line:#262e40;
  --text:#e8eaf0; --dim:#9aa3b5; --faint:#6b7488;
  --gold:#f5c518; --accent:#7c5cff; --accent2:#4fc3f7; --good:#43d17c; --bad:#ff6b6b;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:40;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .tick{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{padding:8px 14px;border-radius:999px;color:var(--dim);font-weight:600}
nav button.on{background:var(--accent);color:#fff}
nav button:not(.on):hover{background:var(--panel2);color:var(--text)}
main{max-width:1060px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:22px;margin:26px 0 4px}
h2:first-child{margin-top:4px}
.sub{color:var(--dim);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.poster{position:relative;aspect-ratio:2/3;background:var(--panel2);cursor:pointer;display:block;width:100%}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:34px}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(13,15,20,.85)}
.badge.own{color:var(--good)} .badge.wl{color:var(--accent2)} .badge.tm{color:var(--gold)}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.ctitle{font-size:14px;font-weight:650;line-height:1.25}
.ctitle .yr{color:var(--faint);font-weight:400}
.stars{display:flex;gap:1px}
.stars button{font-size:21px;line-height:1;color:#3a4258;padding:1px 2px;transition:transform .08s}
.stars button.lit{color:var(--gold)}
.stars button:active{transform:scale(1.25)}
.cacts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.chip{font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip:hover{border-color:var(--faint);color:var(--text)}
.chip.on{background:rgba(67,209,124,.15);border-color:var(--good);color:var(--good)}
.chip.wl.on{background:rgba(79,195,247,.15);border-color:var(--accent2);color:var(--accent2)}
.chip.x:hover{border-color:var(--bad);color:var(--bad)}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h3{margin-bottom:6px}
.panel p{color:var(--dim);font-size:14px;margin:6px 0}
.panel ol{color:var(--dim);font-size:14px;margin:8px 0 8px 20px}
.panel ol li{margin:4px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,#1b1f3a,#151924);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:20px}
.hero h1{font-size:26px;margin-bottom:8px}
.hero p{color:var(--dim);max-width:640px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.filters .chip{font-size:13px;padding:6px 13px}
.filters .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--faint);padding:30px 10px;text-align:center}
.skel{height:250px;border-radius:var(--radius);background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.errbox{color:var(--bad);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);border-radius:10px;padding:12px 14px;font-size:14px}
/* modal */
#modalRoot{position:fixed;inset:0;z-index:60;display:none}
#modalRoot.open{display:block}
.mback{position:absolute;inset:0;background:rgba(5,6,10,.75)}
.msheet{position:absolute;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--line)}
@media(min-width:720px){.msheet{inset:5vh 0 auto 0;margin:0 auto;max-width:680px;border-radius:18px;max-height:88vh}}
.mwrap{padding:20px}
.mhead{display:flex;gap:16px}
.mhead img{width:120px;border-radius:10px;flex:none;align-self:flex-start}
.mtitle{font-size:21px;font-weight:800;line-height:1.2}
.mmeta{color:var(--dim);font-size:13px;margin:6px 0}
.mtag{color:var(--faint);font-style:italic;font-size:14px}
.mclose{position:sticky;top:0;float:right;margin:8px 8px 0 0;font-size:22px;color:var(--dim);background:var(--panel2);border-radius:999px;width:36px;height:36px}
.msec{margin-top:16px}
.msec h4{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin-bottom:8px}
.bigstars button{font-size:34px;padding:2px 4px}
.provrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prov{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.prov img{width:22px;height:22px;border-radius:5px}
.storeopts{display:flex;flex-direction:column;gap:6px}
.storeopts label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--dim);cursor:pointer}
.storeopts input{width:auto}
/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;background:#232a3d;border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.barneg{background:linear-gradient(90deg,#5a4452,var(--bad))}
.barrow{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:7px 0;color:var(--dim)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold)}
.stat span{font-size:13px;color:var(--dim)}
.improw{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.improw img{width:32px;border-radius:4px}
.improw .miss{color:var(--bad)}
.note{font-size:12px;color:var(--faint)}
.searchbar{display:flex;gap:10px;margin-bottom:16px}
hr.sp{border:none;border-top:1px solid var(--line);margin:22px 0}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">🎬 Marquee <span class="tick">★</span></div>

      <button data-tab="shelf">My Movies</button>

<div id="modalRoot"><div class="mback" data-act="closeModal"></div><div class="msheet" id="msheet"></div></div>

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const s=JSON.parse(raw);
      state.settings=Object.assign(state.settings,s.settings||{});
      state.movies=s.movies||{}; state.skips=s.skips||{}; state.cache=s.cache||{};
      state.seedDone=!!s.seedDone; state.seedMissed=s.seedMissed||[];
    }
  }catch(e){}
  // prune records with no real interaction, and stale skips
  for(const [id,m] of Object.entries(state.movies))
    if(m.rating==null && !m.owned && !m.watchlist && !m.dismissed && !(m.note||'').trim()) delete state.movies[id];
  for(const [id,t] of Object.entries(state.skips)) if(Date.now()-t>45*DAY) delete state.skips[id];
}

  let h=2166136261;
  for(const c of seedStr){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}
  const rnd=()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ============ TMDB api ============ */
async function api(path,params={},ttlHours=0){
  const ck=path+'?'+JSON.stringify(params);
  if(ttlHours){const c=state.cache[ck];if(c&&Date.now()-c.t<ttlHours*3600e3)return c.d;}
  const key=(state.settings.apiKey||'').trim();
  if(!key)throw new Error('Add your free TMDB key in Settings first.');
  const u=new URL(TMDB+path);
  for(const [k,v] of Object.entries(params))if(v!=null&&v!=='')u.searchParams.set(k,v);
  const opts={};
  if(key.startsWith('eyJ'))opts.headers={Authorization:'Bearer '+key};else u.searchParams.set('api_key',key);
  const r=await fetch(u,opts);
  if(!r.ok)throw new Error(r.status===401?'TMDB rejected your key — double-check it in Settings.':'TMDB error '+r.status);
  const d=await r.json();
  if(ttlHours){state.cache[ck]={t:Date.now(),d:slim(d)};pruneCache();saveSoon();return state.cache[ck].d;}
  return d;
}
function slim(d){
  if(!d||!Array.isArray(d.results))return d;
  return {results:d.results.slice(0,20).map(m=>({id:m.id,title:m.title,release_date:m.release_date,poster_path:m.poster_path,vote_average:m.vote_average,vote_count:m.vote_count,genre_ids:m.genre_ids}))};
}
function pruneCache(){
  const keys=Object.keys(state.cache);
  if(keys.length<=160)return;
  keys.sort((a,b)=>state.cache[a].t-state.cache[b].t).slice(0,keys.length-160).forEach(k=>delete state.cache[k]);
}
async function details(id){
  const ck='det:'+id, c=state.cache[ck];
  if(c&&Date.now()-c.t<7*DAY)return c.d;
  const d=await api('/movie/'+id,{append_to_response:'watch/providers'});
  const all=(d['watch/providers']&&d['watch/providers'].results)||{};
  const p=all[state.settings.region||'US']||all.US||null;
  const sd={id:d.id,title:d.title,tagline:d.tagline,overview:d.overview,runtime:d.runtime,
    release_date:d.release_date,vote_average:d.vote_average,vote_count:d.vote_count,
    poster_path:d.poster_path,genre_ids:(d.genres||[]).map(g=>g.id),
    providers:p?{link:p.link,flatrate:pv(p.flatrate),rent:pv(p.rent),buy:pv(p.buy)}:null};
  state.cache[ck]={t:Date.now(),d:sd};saveSoon();
  return sd;
}
const pv=a=>(a||[]).slice(0,8).map(x=>({provider_name:x.provider_name,logo_path:x.logo_path}));

/* ============ records ============ */
function remember(m){known.set(m.id,m);}
function record(id){
  if(state.movies[id])return state.movies[id];
  const m=known.get(id);
  if(!m)return null;
  state.movies[id]={id,title:m.title,year:(m.release_date||'').slice(0,4),poster:m.poster_path||null,
    genres:m.genre_ids||[],vote:m.vote_average||0,rating:null,note:'',owned:false,stores:[],
    watchlist:false,dismissed:false,updatedAt:Date.now()};
  return state.movies[id];
}
const getRec=id=>state.movies[id]||null;
const interacted=r=>!!r&&(r.rating!=null||r.owned||r.watchlist||r.dismissed||(r.note||'').trim()!=='');
function fresh(m){
  if(interacted(getRec(m.id)))return false;
  const sk=state.skips[m.id];
  if(sk&&Date.now()-sk<30*DAY)return false;
  return true;
}
function touch(r){r.updatedAt=Date.now();saveSoon();}

/* ============ taste / recommendations ============ */
function genreWeights(){
  const w={};
  for(const m of Object.values(state.movies)){
    if(m.rating==null)continue;
    const s=m.rating-2.5;
    for(const g of m.genres||[])w[g]=(w[g]||0)+s;
  }
  return w;
}
const topGenres=n=>Object.entries(genreWeights()).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>+k);
const affinity=(m,w)=>(m.genre_ids||[]).reduce((a,g)=>a+(w[g]||0),0);
const ratedCount=()=>Object.values(state.movies).filter(m=>m.rating!=null).length;

async function getPicks(){
  const w=genreWeights();
  const loved=Object.values(state.movies).filter(m=>m.rating>=4)
    .sort((a,b)=>b.rating-a.rating||b.updatedAt-a.updatedAt).slice(0,8);
  const score=new Map(),info=new Map();
  await Promise.all(loved.map(async m=>{
    try{
      const d=await api('/movie/'+m.id+'/recommendations',{},24);
      (d.results||[]).forEach((r,i)=>{
        if(!fresh(r))return;
        remember(r);info.set(r.id,r);
        score.set(r.id,(score.get(r.id)||0)+(m.rating-2.5)*(1-i*0.04));
      });
    }catch(e){}
  }));
  for(const [id,r] of info)score.set(id,score.get(id)+0.15*affinity(r,w)+(r.vote_average||0)/20);
  const ranked=[...info.values()].sort((a,b)=>score.get(b.id)-score.get(a.id));
  return seededShuffle(ranked.slice(0,18),'picks'+todayStr()+shuffleBump).slice(0,6);
}
async function getGems(exclude){
  const tg=topGenres(3);
  if(!tg.length)return[];
  const d=await api('/discover/movie',{with_genres:tg.join('|'),sort_by:'vote_average.desc',
    'vote_count.gte':150,'vote_count.lte':2500,'primary_release_date.gte':'1985-01-01',include_adult:false},24);
  const w=genreWeights();
  const list=(d.results||[]).filter(m=>fresh(m)&&!exclude.has(m.id));
  list.forEach(remember);
  list.sort((a,b)=>affinity(b,w)-affinity(a,w));
  return seededShuffle(list.slice(0,12),'gems'+todayStr()+shuffleBump).slice(0,3);
}
async function getNewReleases(exclude){
  const d=await api('/discover/movie',{sort_by:'popularity.desc',
    'primary_release_date.gte':iso(new Date(Date.now()-90*DAY)),
    'primary_release_date.lte':todayStr(),'vote_count.gte':20,include_adult:false},12);
  const w=genreWeights();
  const list=(d.results||[]).filter(m=>fresh(m)&&!exclude.has(m.id));
  list.forEach(remember);
  list.sort((a,b)=>affinity(b,w)-affinity(a,w));
  return list.slice(0,6);
}
async function getRateQueue(exclude){
  const [p1,p2,t1]=await Promise.all([
    api('/movie/popular',{page:1},24),api('/movie/popular',{page:2},24),api('/movie/top_rated',{page:1},24)]);
  const seen=new Set(),pool=[];
  for(const m of [...(t1.results||[]),...(p1.results||[]),...(p2.results||[])]){
    if(seen.has(m.id)||exclude.has(m.id))continue;
    seen.add(m.id);
    if(fresh(m)){remember(m);pool.push(m);}
  }
  return seededShuffle(pool,'rate'+todayStr()+shuffleBump).slice(0,8);
}

function starsHTML(id,rating,big){
  let h='<div class="stars'+(big?' bigstars':'')+'" role="group" aria-label="Rate">';
  for(let v=1;v<=5;v++)
    h+='<button data-act="rate" data-id="'+id+'" data-val="'+v+'" class="'+(rating>=v?'lit':'')+'" title="'+v+' star'+(v>1?'s':'')+'">★</button>';
  return h+'</div>';
}
function posterHTML(m){
  const p=m.poster_path||m.poster;
  const r=getRec(m.id);
  let badges='';
  if(r&&r.owned)badges+='<span class="badge own">OWNED</span>';
  if(r&&r.watchlist)badges+='<span class="badge wl">WATCHLIST</span>';
  const va=m.vote_average||m.vote;
  if(va)badges+='<span class="badge tm">★ '+(+va).toFixed(1)+'</span>';
  return '<button class="poster" data-act="open" data-id="'+m.id+'" aria-label="Details">'+
    (p?'<img loading="lazy" src="'+IMG+'w342'+p+'" alt="">':'<span class="noimg">🎞️</span>')+
    '<span class="badges">'+badges+'</span></button>';
}
function cardHTML(m,opts={}){
  const r=getRec(m.id);
  const title=m.title||(r&&r.title)||'?';
  const year=(m.release_date||'').slice(0,4)||(r&&r.year)||'';
  const rating=r?r.rating:null;
  let acts='';
  acts+='<button class="chip '+(r&&r.owned?'on':'')+'" data-act="own" data-id="'+m.id+'">'+(r&&r.owned?'✓ Own it':'I own it')+'</button>';
  acts+='<button class="chip wl '+(r&&r.watchlist?'on':'')+'" data-act="watch" data-id="'+m.id+'">'+(r&&r.watchlist?'✓ Saved':'Watch later')+'</button>';
  if(opts.skip)acts+='<button class="chip x" data-act="skip" data-id="'+m.id+'">Haven’t seen it</button>';
  if(opts.dismiss)acts+='<button class="chip x" data-act="dismiss" data-id="'+m.id+'">Not for me</button>';
  return '<div class="card" data-cid="'+m.id+'">'+posterHTML(m)+
    '<div class="cbody"><div class="ctitle">'+esc(title)+' <span class="yr">'+esc(year)+'</span></div>'+
    starsHTML(m.id,rating,false)+'<div class="cacts">'+acts+'</div></div></div>';
}
function gridHTML(list,opts){return '<div class="grid">'+list.map(m=>cardHTML(m,opts)).join('')+'</div>';}
const skeletons=n=>'<div class="grid">'+Array.from({length:n},()=>'<div class="skel"></div>').join('')+'</div>';

function setTab(t){tab=t;render();window.scrollTo(0,0);}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));

function renderTaste(v){
  const all=Object.values(state.movies);
  const rated=all.filter(m=>m.rating!=null);
  const w=genreWeights();
  const pos=Object.entries(w).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const neg=Object.entries(w).filter(([,x])=>x<0).sort((a,b)=>a[1]-b[1]).slice(0,4);
  const maxW=Math.max(...pos.map(([,x])=>x),1);
  const minW=Math.min(...neg.map(([,x])=>x),-1);
  const dec={};
  rated.filter(m=>m.rating>=4&&m.year).forEach(m=>{const d=m.year.slice(0,3)+'0s';dec[d]=(dec[d]||0)+1;});
  const decs=Object.entries(dec).sort((a,b)=>b[1]-a[1]);
  const favs=rated.filter(m=>m.rating>=4).sort((a,b)=>b.rating-a.rating||b.updatedAt-a.updatedAt).slice(0,12);
  const avg=rated.length?(rated.reduce((a,m)=>a+m.rating,0)/rated.length).toFixed(1):'—';
  const bar=(label,val,max,negBar)=>'<div class="barrow"><span>'+esc(label)+'</span><div><div class="bar'+(negBar?' barneg':'')+'" style="width:'+Math.round(Math.min(100,Math.abs(val)/Math.abs(max)*100))+'%"></div></div><span>'+(val>0?'+':'')+val.toFixed(1)+'</span></div>';
  v.innerHTML='<h2>Your taste profile</h2><div class="sub">What your ratings tell me — this is exactly what drives your picks</div>'+
    '<div class="statrow">'+
      '<div class="stat"><b>'+rated.length+'</b><span>rated</span></div>'+
      '<div class="stat"><b>'+all.filter(m=>m.owned).length+'</b><span>owned</span></div>'+
      '<div class="stat"><b>'+all.filter(m=>m.watchlist).length+'</b><span>on watchlist</span></div>'+
      '<div class="stat"><b>'+avg+'</b><span>avg stars</span></div></div>'+
    (rated.length<3?'<div class="empty">Rate at least 3 movies and your profile appears here.</div>':
    '<div class="panel"><h3>What you love</h3>'+(pos.length?pos.map(([g,x])=>bar(GENRES[g]||('Genre '+g),x,maxW,false)).join(''):'<p>Rate more movies 4–5★.</p>')+
    (neg.length?'<h3 style="margin-top:16px">Not really your thing</h3>'+neg.map(([g,x])=>bar(GENRES[g]||('Genre '+g),x,minW,true)).join(''):'')+
    (decs.length?'<h3 style="margin-top:16px">Your favorite eras</h3>'+decs.map(([d,n])=>bar(d,n,decs[0][1],false)).join(''):'')+
    '</div>'+
    (favs.length?'<h2>Your hall of fame</h2><div class="sub">The movies doing the heavy lifting in your recommendations</div>'+
      gridHTML(favs.map(r=>({id:r.id,title:r.title,release_date:r.year?r.year+'-01-01':'',poster_path:r.poster,vote_average:r.vote,genre_ids:r.genres})),{}):''));
  favs.forEach(r=>remember({id:r.id,title:r.title,release_date:r.year?r.year+'-01-01':'',poster_path:r.poster,vote_average:r.vote,genre_ids:r.genres}));
}

  '<li>Paste them here, one per line — a year in parentheses helps, like <i>Heat (1995)</i></li></ol>'+
  '<textarea id="bulkText" rows="6" placeholder="Tuner (2025)&#10;Heat (1995)&#10;Gladiator"></textarea>'+
  '<div class="row" style="margin-top:10px"><label class="note" for="bulkStore">These are from:</label>'+
  '<select id="bulkStore" style="width:auto">'+STORES.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>'+
  '<button class="btn" data-act="bulkMatch">Match my movies</button></div>'+
  '<div id="bulkOut" style="margin-top:12px"></div></div>'+

  (state.seedDone&&(state.seedMissed||[]).length?
    '<hr class="sp"><div class="panel"><h3>From your collection, I couldn’t match these</h3>'+
    '<p>Search for them by hand on the Search tab, or paste them above with a corrected title/year:</p>'+
    (state.seedMissed||[]).map(t=>'<div class="improw"><span class="miss">'+esc(t)+'</span></div>').join('')+'</div>':'')+

  '<hr class="sp"><div class="panel"><h3>Backup</h3>'+
  '<p>Your shelf lives in this browser. Export a backup now and then (or to move to a new phone/computer).</p>'+
  '<div class="row"><button class="btn ghost" data-act="export">⬇ Export backup</button>'+
  '<label class="btn ghost" style="cursor:pointer">⬆ Restore backup<input id="importFile" type="file" accept=".json" style="display:none"></label>'+
  '<button class="btn ghost" style="color:var(--bad)" data-act="wipe">Erase everything</button></div></div>';
  const fi=$('#importFile');
  if(fi)fi.addEventListener('change',importBackup);
  const ri=$('#regionInput');
  if(ri)ri.addEventListener('change',()=>{state.settings.region=(ri.value||'US').toUpperCase().slice(0,2);saveSoon();toast('Region saved');});
}

/* ============ seed library (Donte's collection) ============ */
function parseTitleLine(line){
  const m=line.match(/^(.*?)\s*\((\d{4})\)\s*$/);
  return {title:(m?m[1]:line).trim(),year:m?m[2]:null};
}
async function matchTitle(title,year){
  try{
    let d=await api('/search/movie',{query:title,primary_release_year:year||undefined,include_adult:false});
    let hit=(d.results||[])[0]||null;
    if(!hit&&year){d=await api('/search/movie',{query:title,include_adult:false});hit=(d.results||[])[0]||null;}
    return hit;
  }catch(e){return null;}
}
let seedRunning=false;
async function loadSeed(){
  if(seedRunning||state.seedDone)return;
  seedRunning=true;
  const btn=$('#seedBtn'),prog=$('#seedProg');
  if(btn)btn.style.display='none';
  const missed=[];
  let done=0,added=0;
  for(const src of SEED_LIBRARY){
    for(const line of src.titles){
      const {title,year}=parseTitleLine(line);
      const hit=await matchTitle(title,year);
      if(hit){
        remember(hit);
        const r=record(hit.id);
        if(r){r.owned=true;if(!r.stores.includes(src.store))r.stores.push(src.store);r.updatedAt=Date.now();added++;}
      }else missed.push(line+'  ('+src.store+')');
      done++;
      if(prog)prog.textContent='Adding your movies… '+done+' / '+SEED_TOTAL+' checked, '+added+' on the shelf';
      if(done%25===0)save();
      await sleep(110);
    }
  }
  state.seedDone=true;
  state.seedMissed=missed;
  seedRunning=false;
  save();
  toast('Your collection is in — '+added+' movies on your shelf 📀');
  render();
}

/* ============ bulk import ============ */
async function bulkMatch(){
  const ta=$('#bulkText'),out=$('#bulkOut');
  const lines=(ta.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast('Paste some titles first');return;}
  importResults=[];
  out.innerHTML='<p class="note">Matching 0 / '+lines.length+'…</p>';
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const m=line.match(/^(.*?)\s*\((\d{4})\)\s*$/);
    const title=(m?m[1]:line).replace(/^["'‘’“”]+|["'‘’“”]+$/g,'');
    let hit=null;
    try{
      const d=await api('/search/movie',{query:title,primary_release_year:m?m[2]:undefined,include_adult:false});
      hit=(d.results||[])[0]||null;
      if(!hit&&m){const d2=await api('/search/movie',{query:title,include_adult:false});hit=(d2.results||[])[0]||null;}
    }catch(e){}
    if(hit)remember(hit);
    importResults.push({line,hit});
    out.innerHTML='<p class="note">Matching '+(i+1)+' / '+lines.length+'…</p>';
    await sleep(120);
  }
  const ok=importResults.filter(r=>r.hit);
  out.innerHTML=importResults.map((r,i)=>r.hit
    ?'<div class="improw"><input type="checkbox" class="impChk" data-i="'+i+'" checked style="width:auto">'+
      (r.hit.poster_path?'<img src="'+IMG+'w92'+r.hit.poster_path+'" alt="">':'<span>🎞️</span>')+
      '<span>'+esc(r.hit.title)+' <span class="yr" style="color:var(--faint)">'+esc((r.hit.release_date||'').slice(0,4))+'</span></span></div>'
    :'<div class="improw"><span class="miss">✕ Couldn’t match: “'+esc(r.line)+'” — try adding the year</span></div>').join('')+
    (ok.length?'<div class="row" style="margin-top:12px"><button class="btn" data-act="bulkAdd">Add '+ok.length+' movie'+(ok.length>1?'s':'')+' to my shelf as owned</button></div>':'');
}
function bulkAdd(){
  const store=$('#bulkStore')?$('#bulkStore').value:STORES[0];
  let n=0;
  document.querySelectorAll('.impChk').forEach(c=>{
    if(!c.checked)return;
    const r=importResults[+c.dataset.i];
    if(!r||!r.hit)return;
    const rec_=record(r.hit.id);
    if(!rec_)return;
    rec_.owned=true;
    if(!rec_.stores.includes(store))rec_.stores.push(store);
    touch(rec_);n++;
  });
  save();
  toast('Added '+n+' owned movie'+(n===1?'':'s')+' 📀');
  $('#bulkOut').innerHTML='<p class="note">Done — they’re on your shelf under <b>My Movies → Owned</b>. Rate the ones you love so I can learn from them!</p>';
}

/* ============ backup ============ */
function exportBackup(){
  const data={settings:{region:state.settings.region},movies:state.movies,skips:state.skips};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='marquee-backup-'+todayStr()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function importBackup(e){
  const f=e.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.movies)throw 0;
      state.movies=d.movies;
      state.skips=d.skips||{};
      if(d.settings&&d.settings.region)state.settings.region=d.settings.region;
      save();
      toast('Backup restored — '+Object.keys(state.movies).length+' movies');
      render();
    }catch(err){toast('That file doesn’t look like a Marquee backup');}
  };
  rd.readAsText(f);
}

/* ============ modal ============ */
async function openModal(id){
  modalId=id;modalDetail=null;
  $('#modalRoot').classList.add('open');
  document.body.style.overflow='hidden';
  $('#msheet').innerHTML='<div class="mwrap"><div class="skel" style="height:200px"></div></div>';
  try{
    modalDetail=await details(id);
    remember({id:modalDetail.id,title:modalDetail.title,release_date:modalDetail.release_date,
      poster_path:modalDetail.poster_path,vote_average:modalDetail.vote_average,genre_ids:modalDetail.genre_ids});
    if(modalId===id)renderModal();
  }catch(e){
    $('#msheet').innerHTML='<div class="mwrap"><button class="mclose" data-act="closeModal">✕</button><div class="errbox">'+esc(e.message)+'</div></div>';
  }
}
function renderModal(){
  const d=modalDetail;
  if(!d)return;
  const r=getRec(d.id);
  const hrs=d.runtime?Math.floor(d.runtime/60)+'h '+(d.runtime%60)+'m':'';
  const provRow=(label,arr)=>arr&&arr.length?'<div class="msec"><h4>'+label+'</h4><div class="provrow">'+
    arr.map(p=>'<span class="prov">'+(p.logo_path?'<img src="'+IMG+'w45'+p.logo_path+'" alt="">':'')+esc(p.provider_name)+'</span>').join('')+'</div></div>':'';
  $('#msheet').innerHTML='<button class="mclose" data-act="closeModal">✕</button><div class="mwrap">'+
    '<div class="mhead">'+(d.poster_path?'<img src="'+IMG+'w342'+d.poster_path+'" alt="">':'')+
    '<div><div class="mtitle">'+esc(d.title)+'</div>'+
    '<div class="mmeta">'+esc((d.release_date||'').slice(0,4))+(hrs?' · '+hrs:'')+' · TMDB ★ '+(d.vote_average||0).toFixed(1)+
    ' · '+(d.genre_ids||[]).map(g=>GENRES[g]).filter(Boolean).join(', ')+'</div>'+
    (d.tagline?'<div class="mtag">“'+esc(d.tagline)+'”</div>':'')+
    '<div class="msec"><h4>Your rating</h4>'+starsHTML(d.id,r?r.rating:null,true)+'</div></div></div>'+
    '<p style="margin-top:14px;color:var(--dim);font-size:14px">'+esc(d.overview||'')+'</p>'+
    '<div class="msec"><h4>On your shelf</h4><div class="row">'+
      '<button class="chip '+(r&&r.owned?'on':'')+'" data-act="own" data-id="'+d.id+'">'+(r&&r.owned?'✓ I own it':'I own it')+'</button>'+
      '<button class="chip wl '+(r&&r.watchlist?'on':'')+'" data-act="watch" data-id="'+d.id+'">'+(r&&r.watchlist?'✓ On watchlist':'Watch later')+'</button>'+
      '<button class="chip x" data-act="dismiss" data-id="'+d.id+'">'+(r&&r.dismissed?'Un-hide':'Not interested')+'</button></div>'+
    (r&&r.owned?'<div class="storeopts" style="margin-top:10px">'+STORES.map(s=>'<label><input type="checkbox" data-act="store" data-id="'+d.id+'" data-store="'+esc(s)+'"'+(r.stores.includes(s)?' checked':'')+'> '+esc(s)+'</label>').join('')+'</div>':'')+'</div>'+
    '<div class="msec"><h4>What did you think? <span style="text-transform:none;letter-spacing:0">(optional — I use this to understand your taste)</span></h4>'+
    '<textarea id="noteBox" rows="3" placeholder="e.g. loved the tension, hated the ending…">'+esc(r?r.note:'')+'</textarea>'+
    '<div class="row" style="margin-top:8px"><button class="btn small" data-act="saveNote" data-id="'+d.id+'">Save note</button></div></div>'+
    provRow('Stream it now',d.providers&&d.providers.flatrate)+
    provRow('Rent',d.providers&&d.providers.rent)+
    provRow('Buy',d.providers&&d.providers.buy)+
    '<div class="msec"><a href="https://www.themoviedb.org/movie/'+d.id+'" target="_blank" rel="noopener">More on TMDB ↗</a></div>'+
  '</div>';
}
function closeModal(){
  modalId=null;
  $('#modalRoot').classList.remove('open');
  document.body.style.overflow='';
  render(); // reflect badge/star changes on cards
}

/* ============ actions (event delegation) ============ */
async function saveKeyFlow(){
  const inp=$('#keyInput');
  const key=(inp&&inp.value||'').trim();
  if(!key){toast('Paste your TMDB key first');return;}
  const prev=state.settings.apiKey;
  state.settings.apiKey=key;
  try{
    await api('/genre/movie/list',{});
    save();
    toast('You’re in! 🎬');
    setTab('tonight');
  }catch(e){
    state.settings.apiKey=prev;
    toast(e.message);
  }
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act,id=+el.dataset.id||null;
  if(act==='open'){openModal(id);return;}
  if(act==='closeModal'){closeModal();return;}
  if(act==='saveKey'){saveKeyFlow();return;}
  if(act==='reshuffle'){shuffleBump++;render();return;}
  if(act==='shelfFilter'){shelfFilter=el.dataset.val;renderShelf($('#view'));return;}
  if(act==='loadSeed'){loadSeed();return;}
  if(act==='bulkMatch'){bulkMatch();return;}
  if(act==='bulkAdd'){bulkAdd();return;}
  if(act==='export'){exportBackup();return;}
  if(act==='wipe'){
    if(confirm('Erase ALL your ratings, owned movies and settings from this browser? This cannot be undone.')){
      localStorage.removeItem(LS_KEY);
      state={settings:{apiKey:'',region:'US'},movies:{},skips:{},cache:{}};
      render();toast('All data erased');
    }
    return;
  }
  if(act==='rate'){
    const r=record(id);
    if(!r){toast('Hmm, open the movie and try again');return;}
    const val=+el.dataset.val;
    r.rating=(r.rating===val)?null:val;   // tap same star again to clear
    touch(r);
    if(r.rating!=null)toast(r.rating>=4?'★'.repeat(r.rating)+' — got it, more like this coming!':'★'.repeat(r.rating)+' — noted');
    else toast('Rating cleared');
    if(modalId===id)renderModal();
    refreshCard(id);
    return;
  }
  if(act==='own'){
    const r=record(id);if(!r)return;
    r.owned=!r.owned;
    if(!r.owned)r.stores=[];
    touch(r);
    toast(r.owned?'Added to your collection 📀':'Removed from your collection');
    if(modalId===id)renderModal();
    refreshCard(id);
    return;
  }
  if(act==='watch'){
    const r=record(id);if(!r)return;
    r.watchlist=!r.watchlist;
    touch(r);
    toast(r.watchlist?'Saved for later 🔖':'Removed from watchlist');
    if(modalId===id)renderModal();
    refreshCard(id);
    return;
  }
  if(act==='dismiss'){
    const r=record(id);if(!r)return;
    r.dismissed=!r.dismissed;
    touch(r);
    toast(r.dismissed?'Got it — I won’t suggest that one again':'Okay, back in the mix');
    if(modalId===id)renderModal();else removeCard(id);
    return;
  }
  if(act==='skip'){
    state.skips[id]=Date.now();
    saveSoon();
    removeCard(id);
    return;
  }
  if(act==='saveNote'){
    const r=record(id);if(!r)return;
    r.note=($('#noteBox')&&$('#noteBox').value||'').trim();
    touch(r);
    toast('Note saved ✍️');
    return;
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act="store"]');
  if(!el)return;
  const r=record(+el.dataset.id);
  if(!r)return;
  const s=el.dataset.store;
  if(el.checked){if(!r.stores.includes(s))r.stores.push(s);}
  else r.stores=r.stores.filter(x=>x!==s);
  touch(r);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalId!=null)closeModal();});
window.addEventListener('pagehide',()=>{if(dirty)save();});
document.addEventListener('visibilitychange',()=>{if(dirty&&document.visibilityState==='hidden')save();});
function refreshCard(id){
  document.querySelectorAll('.card[data-cid="'+id+'"]').forEach(c=>{
    const m=known.get(id)||getRec(id);
    if(!m)return;
    const src=m.title!==undefined&&m.release_date!==undefined?m:{id:m.id,title:m.title,release_date:m.year?m.year+'-01-01':'',poster_path:m.poster,vote_average:m.vote,genre_ids:m.genres};
    const wrap=document.createElement('div');
    wrap.innerHTML=cardHTML(src,{skip:!!c.querySelector('[data-act="skip"]'),dismiss:!!c.querySelector('[data-act="dismiss"]')});
    c.replaceWith(wrap.firstChild);
  });
}
function removeCard(id){document.querySelectorAll('.card[data-cid="'+id+'"]').forEach(c=>{c.style.opacity='0';c.style.transition='opacity .25s';setTimeout(()=>c.remove(),250);});}

/* ============ nav & boot ============ */
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
load();
if(!state.settings.apiKey)tab='tonight'; // shows setup hero
render();
</script>
