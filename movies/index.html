<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee — your movie shelf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<style>
:root{
  --bg:#0d0f14; --panel:#151924; --panel2:#1c2230; --line:#262e40;
  --text:#e8eaf0; --dim:#9aa3b5; --faint:#6b7488;
  --gold:#f5c518; --accent:#7c5cff; --accent2:#4fc3f7; --good:#43d17c; --bad:#ff6b6b;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:40;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .tick{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{padding:8px 14px;border-radius:999px;color:var(--dim);font-weight:600}
nav button.on{background:var(--accent);color:#fff}
nav button:not(.on):hover{background:var(--panel2);color:var(--text)}
main{max-width:1060px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:22px;margin:26px 0 4px}
h2:first-child{margin-top:4px}
.sub{color:var(--dim);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.xbtn{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:999px;
  background:rgba(13,15,20,.8);color:var(--dim);font-size:15px;line-height:1;z-index:2;
  display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:var(--bad);color:#fff}
.poster{position:relative;aspect-ratio:2/3;background:var(--panel2);cursor:pointer;display:block;width:100%}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:34px}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(13,15,20,.85)}
.badge.own{color:var(--good)} .badge.wl{color:var(--accent2)} .badge.tm{color:var(--gold)}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.ctitle{font-size:14px;font-weight:650;line-height:1.25}
.ctitle .yr{color:var(--faint);font-weight:400}
.why{font-size:11px;color:var(--accent2);line-height:1.3}
.why b{color:var(--text);font-weight:650}
.stars{display:flex;gap:0;align-items:center}
.stars button{font-size:14px;line-height:1;color:#3a4258;padding:2px 1px;transition:transform .08s}
.stars button.lit{color:var(--gold)}
.stars button:active{transform:scale(1.3)}
.rnum{font-size:12px;font-weight:800;color:var(--gold);margin-left:5px}
.subs{display:flex;flex-direction:column;gap:7px}
.subrow{display:grid;grid-template-columns:96px 1fr 22px;align-items:center;gap:8px}
.sublab{font-size:13px;color:var(--dim)}
.dots{display:flex;gap:2px}
.dots button{font-size:13px;line-height:1;color:#3a4258;padding:3px 1px}
.dots button.lit{color:var(--accent2)}
.subn{font-size:12px;font-weight:800;color:var(--accent2);text-align:right}
.cacts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.chip{font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip:hover{border-color:var(--faint);color:var(--text)}
.chip.on{background:rgba(67,209,124,.15);border-color:var(--good);color:var(--good)}
.chip.wl.on{background:rgba(79,195,247,.15);border-color:var(--accent2);color:var(--accent2)}
.chip.x:hover{border-color:var(--bad);color:var(--bad)}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h3{margin-bottom:6px}
.panel p{color:var(--dim);font-size:14px;margin:6px 0}
.panel ol{color:var(--dim);font-size:14px;margin:8px 0 8px 20px}
.panel ol li{margin:4px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,#1b1f3a,#151924);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:20px}
.hero h1{font-size:26px;margin-bottom:8px}
.hero p{color:var(--dim);max-width:640px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.filters .chip{font-size:13px;padding:6px 13px}
.filters .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--faint);padding:30px 10px;text-align:center}
.skel{height:250px;border-radius:var(--radius);background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.errbox{color:var(--bad);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);border-radius:10px;padding:12px 14px;font-size:14px}
/* modal */
#modalRoot{position:fixed;inset:0;z-index:60;display:none}
#modalRoot.open{display:block}
.mback{position:absolute;inset:0;background:rgba(5,6,10,.75)}
.msheet{position:absolute;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--line)}
@media(min-width:720px){.msheet{inset:5vh 0 auto 0;margin:0 auto;max-width:680px;border-radius:18px;max-height:88vh}}
.mwrap{padding:20px}
.mhead{display:flex;gap:16px}
.mhead img{width:120px;border-radius:10px;flex:none;align-self:flex-start}
.mtitle{font-size:21px;font-weight:800;line-height:1.2}
.mmeta{color:var(--dim);font-size:13px;margin:6px 0}
.mtag{color:var(--faint);font-style:italic;font-size:14px}
.mclose{position:sticky;top:0;float:right;margin:8px 8px 0 0;font-size:22px;color:var(--dim);background:var(--panel2);border-radius:999px;width:36px;height:36px}
.msec{margin-top:16px}
.msec h4{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin-bottom:8px}
.bigstars button{font-size:24px;padding:2px 2px}
.bigstars .rnum{font-size:16px}
.provrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prov{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.prov img{width:22px;height:22px;border-radius:5px}
.storeopts{display:flex;flex-direction:column;gap:6px}
.storeopts label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--dim);cursor:pointer}
.storeopts input{width:auto}
/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;background:#232a3d;border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.barneg{background:linear-gradient(90deg,#5a4452,var(--bad))}
.barrow{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:7px 0;color:var(--dim)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold)}
.stat span{font-size:13px;color:var(--dim)}
.improw{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.improw img{width:32px;border-radius:4px}
.improw .miss{color:var(--bad)}
.note{font-size:12px;color:var(--faint)}
.searchbar{display:flex;gap:10px;margin-bottom:16px}
hr.sp{border:none;border-top:1px solid var(--line);margin:22px 0}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">🎬 Marquee <span class="tick">★</span></div>

      <button data-tab="settings">Settings</button>

  </div>
</header>
<main id="view"></main>
<div id="modalRoot"><div class="mback" data-act="closeModal"></div><div class="msheet" id="msheet"></div></div>
<div id="toast"></div>

function seededShuffle(arr,seedStr){
  let h=2166136261;
  for(const c of seedStr){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}
  const rnd=()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

async function api(path,params={},ttlHours=0){
  const ck=path+'?'+JSON.stringify(params);
  if(ttlHours){const c=state.cache[ck];if(c&&Date.now()-c.t<ttlHours*3600e3)return c.d;}
  const key=(state.settings.apiKey||'').trim();
  if(!key)throw new Error('Add your free TMDB key in Settings first.');
  const u=new URL(TMDB+path);
  for(const [k,v] of Object.entries(params))if(v!=null&&v!=='')u.searchParams.set(k,v);
  const opts={};
  if(key.startsWith('eyJ'))opts.headers={Authorization:'Bearer '+key};else u.searchParams.set('api_key',key);
  const r=await fetch(u,opts);
  if(!r.ok)throw new Error(r.status===401?'TMDB rejected your key — double-check it in Settings.':'TMDB error '+r.status);
  const d=await r.json();
  if(ttlHours){state.cache[ck]={t:Date.now(),d:slim(d)};pruneCache();saveSoon();return state.cache[ck].d;}
  return d;
}

// Genres are a 19-word vocabulary. What actually separates one drama from another is
// its keywords (what it is ABOUT) and its people (who made it). We fetch both per
// rated film, then learn feature weights from the ratings themselves.
const FACT_TTL=45*DAY, FACT_CAP=2400;

// the model the same things a rating does: themes, film-makers, craft.
const OWN_W=0.35, OWN_VALUE=0.3, OWN_LOVED_BONUS=0.3;

// a foreign film has to be markedly better than an English one to earn a slot.
const LANG_PEN={rarely:1.2,sometimes:0.5,freely:0};
const langPref=()=>state.settings.langPref||'rarely';
const langPenalty=m=>{
  const l=m.original_language||m.l;
  return (!l||l==='en')?0:(LANG_PEN[langPref()]||0);
};
// Same idea for older films, but with a carve-out for the canon: Star Wars and
// The Godfather earn their slot on reputation, Jaws 2 does not.
const ERA_CUT=1980, ERA_PEN={rarely:1.2,sometimes:0.5,freely:0};
const eraPref=()=>state.settings.eraPref||'rarely';
const eraPenalty=m=>{
  const y=+((m.release_date||'').slice(0,4))||m.y||0;
  if(!y||y>=ERA_CUT)return 0;
  const pen=ERA_PEN[eraPref()]||0;
  if(!pen)return 0;
  const v=m.vote_average||m.v||0, n=m.vote_count||m.vc||0;
  if(v>=7.9&&n>=4000)return 0;        // genuinely canonical - no penalty at all
  if(v>=7.5&&n>=1500)return pen*0.4;  // a strong classic - shown, but behind
  return pen;
};
const penalty=m=>langPenalty(m)+eraPenalty(m);
const SHAPE={
  'xlen1':'tight (under 1h40)','xlen2':'standard (1h40-2h05)',
  'xlen3':'long (2h05-2h30)','xlen4':'epic (2h30+)',
  'xreach1':'under the radar','xreach2':'well known','xreach3':'blockbuster reach',
  'xlangen':'English-language','xacclaim':'critically adored'
};
function featuresOf(f){
  const out=[];
  if(!f)return out;
  for(const x of f.k||[])out.push('k'+x);
  for(const x of f.d||[])out.push('d'+x);
  for(const x of f.w||[])out.push('w'+x);
  for(const x of f.c||[])out.push('c'+x);
  for(const x of f.m||[])out.push('m'+x);
  for(const x of f.f||[])out.push('f'+x);
  for(const x of f.o||[])out.push('o'+x);
  for(const x of f.g||[])out.push('g'+x);
  // shape of the film itself \u2014 runtime stands in for pacing/patience
  if(f.rt)out.push('xlen'+(f.rt<100?1:f.rt<125?2:f.rt<150?3:4));
  if(f.vc)out.push('xreach'+(f.vc<1500?1:f.vc<8000?2:3));
  if(f.l)out.push('xlang'+f.l);
  if(f.y)out.push('xera'+(Math.floor(f.y/10)*10));
  if((f.v||0)>=7.8)out.push('xacclaim');
  for(const o of out)if(o[0]==='x'&&!state.names[o])
    state.names[o]=SHAPE[o]||(o.startsWith('xera')?o.slice(4)+'s':o.slice(1));
  return out;
}

// Feature weights: mean-centred (so loving everything says nothing), shrunk toward
// zero by support (one 10 isn't proof), and IDF-scaled (a tag on every film is noise).
function tasteVector(){
  const useOwned=state.settings.ownedSignal!==false;
  const docs=[];
  for(const m of Object.values(state.movies)){
    if(!state.facts[m.id])continue;
    if(m.rating!=null)docs.push({m:m,wt:1,rated:true});
    else if(useOwned&&m.owned)docs.push({m:m,wt:OWN_W,rated:false});
  }
  const rd=docs.filter(d=>d.rated);
  if(rd.length<3&&docs.length<12)return null;
  const mean=rd.length?rd.reduce((a,d)=>a+d.m.rating,0)/rd.length:7;
  const sd=rd.length?Math.sqrt(rd.reduce((a,d)=>a+(d.m.rating-mean)*(d.m.rating-mean),0)/rd.length):0;
  const centre=(rd.length&&sd>=0.6)?mean:6;
  const sum={},wsum={},df={};
  for(const d of docs){
    const m=d.m;
    // an unrated film you own reads as a quiet yes; a rated one speaks for itself
    const base=d.rated?(m.rating-centre):OWN_VALUE;
    const bonus=(d.rated&&m.owned&&m.rating>=8)?OWN_LOVED_BONUS:0;   // loved AND bought
    for(const f of featuresOf(state.facts[m.id])){
      const ch=CHAN[f[0]]||'all';
      let c=(d.rated&&m.sub&&ch!=='all'&&m.sub[ch]!=null)?m.sub[ch]-centre:base;
      if(d.rated)for(const t of m.tags||[]){
        const fx=TAGFX[t];
        if(fx)c+=(fx[ch]||0)+(fx.all||0);
      }
      c+=bonus;
      sum[f]=(sum[f]||0)+d.wt*c;
      wsum[f]=(wsum[f]||0)+d.wt;
      df[f]=(df[f]||0)+1;
    }
  }
  const N=docs.length,w={};
  const BOOST={d:1.6,f:1.55,w:1.5,k:1.2,m:1.2,c:0.9,x:0.8,o:0.7,g:0.6};
  for(const f in sum){
    // weighted mean, so a big collection cannot shout down a considered score
    w[f]=(sum[f]/(wsum[f]+2))*Math.log(1+N/(1+df[f]))*(BOOST[f[0]]||1);
  }
  return {w:w,mean:mean,centre:centre,N:N,sd:sd,nRated:rd.length,nOwned:docs.length-rd.length};
}
function deepScore(id,tv){
  const f=state.facts[id];
  if(!f||!tv)return null;
  const fs=featuresOf(f);
  if(!fs.length)return null;
  let s=0;const up=[];
  for(const k of fs){const v=tv.w[k]||0;s+=v;if(v>0.02)up.push([k,v]);}
  // a shared cinematographer or composer is a more telling reason than a shared genre
  up.sort((a,b)=>(b[1]*(('fmd'.includes(b[0][0]))?1.25:1))-(a[1]*(('fmd'.includes(a[0][0]))?1.25:1)));
  return {score:s/Math.sqrt(fs.length),
    top:up.slice(0,2).map(([k])=>state.names[k]).filter(Boolean)};
}
function rankedFeatures(tv,prefix,n,negative){
  if(!tv)return [];
  return Object.entries(tv.w)
    .filter(([k,v])=>k[0]===prefix&&(negative?v<-0.02:v>0.02))
    .sort((a,b)=>negative?a[1]-b[1]:b[1]-a[1]).slice(0,n)
    .map(([k,v])=>({id:k.slice(1),key:k,name:state.names[k]||k,w:v}));
}

/* ============ taste / recommendations ============ */
// Your ratings drive the model. Owning something is only a faint prior, and genre
// fit is normalised to roughly -1..1 so it can nudge the ranking but never dominate
// the "similar to what you loved" signal.
function genreWeights(){
  const rated={},owned={};
  let nRated=0,nOwned=0;
  for(const m of Object.values(state.movies)){
    const gs=m.genres||[];
    if(!gs.length)continue;
    if(m.rating!=null){
      nRated++;
      const s=(m.rating-6)/4;            // 10 -> +1, 6 -> 0, 1 -> -1.25
      for(const g of gs)rated[g]=(rated[g]||0)+s;
    }else if(m.owned){
      nOwned++;
      for(const g of gs)owned[g]=(owned[g]||0)+1;
    }
  }
  const useOwned=state.settings.ownedSignal!==false;
  const div=Math.max(1,Math.sqrt(nRated));
  const w={};
  for(const g of new Set([...Object.keys(rated),...Object.keys(owned)])){
    let v=(rated[g]||0)/div;
    if(useOwned&&nOwned)v+=0.35*((owned[g]||0)/nOwned);
    w[g]=v;
  }
  return w;
}
const maxWeight=w=>Math.max(1,...Object.values(w).map(Math.abs));
// mean, not sum: a film tagged with five genres shouldn't outrank a focused one
const affinity=(m,w)=>{
  const gs=m.genre_ids||m.genres||[];
  if(!gs.length)return 0;
  return gs.reduce((a,g)=>a+(w[g]||0),0)/gs.length;
};
const affinityNorm=(m,w,mx)=>affinity(m,w)/(mx||maxWeight(w));
const ownedCount=()=>Object.values(state.movies).filter(m=>m.owned).length;
const ratedCount=()=>Object.values(state.movies).filter(m=>m.rating!=null).length;
const topGenres=n=>Object.entries(genreWeights()).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>+k);
const dislikedGenres=()=>Object.entries(genreWeights()).filter(([,v])=>v<-0.15).sort((a,b)=>a[1]-b[1]).slice(0,4).map(([k])=>+k);

// the movies your picks are reasoned from: your highest scores, rotated daily
function pickSources(){
  const loved=Object.values(state.movies).filter(m=>m.rating>=8);
  if(loved.length)
    return seededShuffle(loved,'src'+todayStr()+shuffleBump)
      .sort((a,b)=>b.rating-a.rating).slice(0,12);
  const ownedPool=Object.values(state.movies).filter(m=>m.rating==null&&m.owned&&(m.vote||0)>=6.5);
  return seededShuffle(ownedPool,'ownedseed'+todayStr()+shuffleBump).slice(0,8)
    .map(m=>Object.assign({},m,{rating:8,_proxy:true}));
}

async function getPicks(){
  const w=genreWeights(),mx=maxWeight(w),tv=tasteVector();
  const sources=pickSources();

  await Promise.all(sources.map(async m=>{
    try{
      const d=await api('/movie/'+m.id+'/recommendations',{},24);
      (d.results||[]).forEach((r,i)=>{
        if(!fresh(r))return;
        remember(r);info.set(r.id,r);
        const add=((m.rating||8)-5)/5*(1-i*0.03);
        score.set(r.id,(score.get(r.id)||0)+add);
        const cur=why.get(r.id);
        if(!cur||add>cur.v)why.set(r.id,{v:add,src:m.title,rating:m._proxy?null:m.rating});
      });
    }catch(e){}
  }));
  // 2. discovery by the themes and film-makers your ratings actually reward
  if(tv){
    const kw=rankedFeatures(tv,'k',6),bad=rankedFeatures(tv,'k',8,true);
    const ppl=rankedFeatures(tv,'d',3).concat(rankedFeatures(tv,'w',3));
    const jobs=[];
    if(kw.length){
      const p={with_keywords:kw.map(x=>x.id).join('|'),sort_by:'vote_average.desc',
        'vote_count.gte':200,include_adult:false};
      if(bad.length)p.without_keywords=bad.map(x=>x.id).join(',');
      jobs.push(api('/discover/movie',p,24));
    }
    if(ppl.length)jobs.push(api('/discover/movie',{with_people:ppl.map(x=>x.id).join('|'),
      sort_by:'popularity.desc','vote_count.gte':100,include_adult:false},24));
    const res=await Promise.all(jobs.map(j=>j.catch(()=>({results:[]}))));
    for(const d of res)for(const r of (d.results||[])){
      if(!fresh(r)||info.has(r.id))continue;
      remember(r);info.set(r.id,r);
      score.set(r.id,(score.get(r.id)||0)+0.35);
    }
  }
  // 3. cheap pass to shortlist, then a real content match on the survivors
  for(const [id,r] of info)
    score.set(id,score.get(id)+0.8*affinityNorm(r,w,mx)
      +0.25*Math.max(0,((r.vote_average||0)-6)/4)-penalty(r));
  const shortlist=[...info.values()].sort((a,b)=>score.get(b.id)-score.get(a.id)).slice(0,24);
  if(tv){
    await Promise.all(shortlist.map(async r=>{
      try{await movieFacts(r.id);}catch(e){}
    }));
    saveSoon();
    for(const r of shortlist){
      const ds=deepScore(r.id,tv);
      if(!ds)continue;
      score.set(r.id,score.get(r.id)+2.2*ds.score);   // content match now leads
      const y=why.get(r.id)||{};
      y.feats=ds.top;why.set(r.id,y);
    }
  }
  shortlist.sort((a,b)=>score.get(b.id)-score.get(a.id));
  shortlist.forEach(r=>{const y=why.get(r.id);if(y)r._why=y;});
  return shortlist.slice(0,16);   // 6 shown, the rest wait on the bench
}
async function getGems(exclude){
  const tg=topGenres(3);
  if(!tg.length)return[];
  const params={with_genres:tg.join('|'),sort_by:'vote_average.desc',
    'vote_count.gte':150,'vote_count.lte':2500,'primary_release_date.gte':'1985-01-01',include_adult:false};
  const bad=dislikedGenres();
  if(bad.length)params.without_genres=bad.join(',');
  const d=await api('/discover/movie',params,24);
  const w=genreWeights(),mx=maxWeight(w);
  const list=(d.results||[]).filter(m=>fresh(m)&&!exclude.has(m.id));
  list.forEach(remember);
  list.sort((a,b)=>(affinityNorm(b,w,mx)-penalty(b))-(affinityNorm(a,w,mx)-penalty(a)));
  const top=list.slice(0,12);
  top.forEach(m=>{m._why={title:tg.map(g=>GENRES[g]).filter(Boolean).join(' + '),genre:true};});
  return seededShuffle(top,'gems'+todayStr()+shuffleBump).slice(0,9);
}
async function getNewReleases(exclude){
  const params={sort_by:'popularity.desc',
    'primary_release_date.gte':iso(new Date(Date.now()-90*DAY)),
    'primary_release_date.lte':todayStr(),'vote_count.gte':20,include_adult:false};
  const bad=dislikedGenres();
  if(bad.length)params.without_genres=bad.join(',');
  const d=await api('/discover/movie',params,12);
  const w=genreWeights(),mx=maxWeight(w);
  const list=(d.results||[]).filter(m=>fresh(m)&&!exclude.has(m.id));
  list.forEach(remember);
  list.sort((a,b)=>(affinityNorm(b,w,mx)-penalty(b))-(affinityNorm(a,w,mx)-penalty(a)));
  return list.slice(0,14);
}
// the training queue should also look like your shelf, not a generic top-100
async function getRateQueue(exclude){
  const tg=topGenres(3);
  const calls=[api('/movie/popular',{page:1},24),api('/movie/top_rated',{page:1},24)];
  if(tg.length){
    const bad=dislikedGenres();
    const p={with_genres:tg.join('|'),sort_by:'popularity.desc','vote_count.gte':400,include_adult:false};
    if(bad.length)p.without_genres=bad.join(',');
    calls.unshift(api('/discover/movie',p,24),api('/discover/movie',Object.assign({},p,{page:2}),24));
  }
  const res=await Promise.all(calls.map(c=>c.catch(()=>({results:[]}))));
  const w=genreWeights(),mx=maxWeight(w);
  const seen=new Set(),pool=[];
  for(const d of res)for(const m of (d.results||[])){
    if(seen.has(m.id)||exclude.has(m.id))continue;
    seen.add(m.id);
    if(fresh(m)){remember(m);pool.push(m);}
  }
  pool.sort((a,b)=>(affinityNorm(b,w,mx)-penalty(b))-(affinityNorm(a,w,mx)-penalty(a)));
  return seededShuffle(pool.slice(0,30),'rate'+todayStr()+shuffleBump).slice(0,20);
}

function renderTaste(v){
  const all=Object.values(state.movies);
  const rated=all.filter(m=>m.rating!=null);
  const w=genreWeights();
  const pos=Object.entries(w).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const neg=Object.entries(w).filter(([,x])=>x<0).sort((a,b)=>a[1]-b[1]).slice(0,4);
  const maxW=Math.max(...pos.map(([,x])=>x),1);
  const minW=Math.min(...neg.map(([,x])=>x),-1);
  const dec={};
  all.forEach(m=>{
    if(!m.year)return;
    const wgt=m.rating>=8?1:(m.rating==null&&m.owned?0.3:0);
    if(!wgt)return;
    const d=m.year.slice(0,3)+'0s';
    dec[d]=(dec[d]||0)+wgt;
  });
  const decs=Object.entries(dec).sort((a,b)=>b[1]-a[1]);
  const favs=rated.filter(m=>m.rating>=8).sort((a,b)=>b.rating-a.rating||b.updatedAt-a.updatedAt).slice(0,12);

/* ============ seed library (Donte's collection) ============ */
function parseTitleLine(line){
  const m=line.match(/^(.*?)\s*\((\d{4})\)\s*$/);
  return {title:(m?m[1]:line).trim(),year:m?m[2]:null};
}
async function matchTitle(title,year){
  try{
    let d=await api('/search/movie',{query:title,primary_release_year:year||undefined,include_adult:false});
    let hit=(d.results||[])[0]||null;
    if(!hit&&year){d=await api('/search/movie',{query:title,include_adult:false});hit=(d.results||[])[0]||null;}
    return hit;
  }catch(e){return null;}
}
let seedRunning=false;
async function loadSeed(){
  if(seedRunning||state.seedDone)return;
  seedRunning=true;
  const btn=$('#seedBtn'),prog=$('#seedProg');
  if(btn)btn.style.display='none';
  const missed=[];
  let done=0,added=0;
  for(const src of SEED_LIBRARY){
    for(const line of src.titles){
      const {title,year}=parseTitleLine(line);
      const hit=await matchTitle(title,year);
      if(hit){
        remember(hit);
        const r=record(hit.id);
        if(r){r.owned=true;if(!r.stores.includes(src.store))r.stores.push(src.store);r.updatedAt=Date.now();added++;}
      }else missed.push(line+'  ('+src.store+')');
      done++;
      if(prog)prog.textContent='Adding your movies… '+done+' / '+SEED_TOTAL+' checked, '+added+' on the shelf';
      if(done%25===0)save();
      await sleep(110);
    }
  }
  state.seedDone=true;
  state.seedMissed=missed;
  seedRunning=false;
  save();
  toast('Your collection is in — '+added+' movies on your shelf 📀');
  render();
  if(!state.ratingsDone)loadRatings();
}

let ratingsRunning=false;
async function loadRatings(){
  if(ratingsRunning||state.ratingsDone)return;
  ratingsRunning=true;
  const btn=$('#ratingsBtn'),prog=$('#ratingsProg');
  if(btn)btn.style.display='none';
  const missed=[];
  let done=0,set=0;
  for(const item of SEED_RATINGS){
    const hit=await matchTitle(item.t,item.y);
    if(hit){
      remember(hit);
      const r=record(hit.id);
      if(r){
        r.rating=item.r;
        if(item.n&&!(r.note||'').trim())r.note=item.n;
        r.updatedAt=Date.now();set++;
      }
    }else missed.push(item.t+' ('+item.y+')');
    done++;
    if(prog)prog.textContent='Scoring your movies… '+done+' / '+SEED_RATINGS.length+' checked, '+set+' rated';
    if(done%10===0)save();
    await sleep(110);
  }
  state.ratingsDone=true;
  if(missed.length)state.seedMissed=(state.seedMissed||[]).concat(missed.map(t=>t+'  (ratings list)'));
  ratingsRunning=false;
  save();
  toast('Your ratings are in — '+set+' movies scored ⭐');
  render();
}

/* ============ bulk import ============ */
async function bulkMatch(){
  const ta=$('#bulkText'),out=$('#bulkOut');
  const lines=(ta.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast('Paste some titles first');return;}
  importResults=[];
  out.innerHTML='<p class="note">Matching 0 / '+lines.length+'…</p>';
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const m=line.match(/^(.*?)\s*\((\d{4})\)\s*$/);
    const title=(m?m[1]:line).replace(/^["'‘’“”]+|["'‘’“”]+$/g,'');
    let hit=null;
    try{
      const d=await api('/search/movie',{query:title,primary_release_year:m?m[2]:undefined,include_adult:false});
      hit=(d.results||[])[0]||null;
      if(!hit&&m){const d2=await api('/search/movie',{query:title,include_adult:false});hit=(d2.results||[])[0]||null;}
    }catch(e){}
    if(hit)remember(hit);
    importResults.push({line,hit});
    out.innerHTML='<p class="note">Matching '+(i+1)+' / '+lines.length+'…</p>';
    await sleep(120);
  }
  const ok=importResults.filter(r=>r.hit);
  out.innerHTML=importResults.map((r,i)=>r.hit
    ?'<div class="improw"><input type="checkbox" class="impChk" data-i="'+i+'" checked style="width:auto">'+
      (r.hit.poster_path?'<img src="'+IMG+'w92'+r.hit.poster_path+'" alt="">':'<span>🎞️</span>')+
      '<span>'+esc(r.hit.title)+' <span class="yr" style="color:var(--faint)">'+esc((r.hit.release_date||'').slice(0,4))+'</span></span></div>'
    :'<div class="improw"><span class="miss">✕ Couldn’t match: “'+esc(r.line)+'” — try adding the year</span></div>').join('')+
    (ok.length?'<div class="row" style="margin-top:12px"><button class="btn" data-act="bulkAdd">Add '+ok.length+' movie'+(ok.length>1?'s':'')+' to my shelf as owned</button></div>':'');
}
function bulkAdd(){
  const store=$('#bulkStore')?$('#bulkStore').value:STORES[0];
  let n=0;
  document.querySelectorAll('.impChk').forEach(c=>{
    if(!c.checked)return;
    const r=importResults[+c.dataset.i];
    if(!r||!r.hit)return;
    const rec_=record(r.hit.id);
    if(!rec_)return;
    rec_.owned=true;
    if(!rec_.stores.includes(store))rec_.stores.push(store);
    touch(rec_);n++;
  });
  save();
  toast('Added '+n+' owned movie'+(n===1?'':'s')+' 📀');
  $('#bulkOut').innerHTML='<p class="note">Done — they’re on your shelf under <b>My Movies → Owned</b>. Rate the ones you love so I can learn from them!</p>';
}

/* ============ conversation bridge ============ */
// A compact, readable digest of the profile, meant to be pasted into a chat so the
// conversation can pick up exactly where the app left off.
function buildBriefing(){
  const all=Object.values(state.movies);
  const rated=all.filter(m=>m.rating!=null).sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title));
  const tv=tasteVector();
  const L=[];
  L.push('MY MOVIE TASTE - Marquee briefing ('+todayStr()+')');
  L.push(rated.length+' rated, '+all.filter(m=>m.owned).length+' owned'+
    (tv?' ('+tv.nRated+' rated and '+tv.nOwned+' owned films studied in depth)':', none studied in depth yet'));
  L.push('Foreign-language films: '+langPref()+' (English is my default).');
  L.push('Films made before 1980: '+eraPref()+' - only the canonical ones (Star Wars, The Godfather).');
  if(rated.length)L.push('Average score '+(rated.reduce((a,m)=>a+m.rating,0)/rated.length).toFixed(2)+
    ' - treat anything below that as a criticism.');
  const fmt=list=>list.map(f=>f.name+' ('+(f.w>0?'+':'')+f.w.toFixed(2)+')').join(', ');
  if(tv){
    L.push('');L.push('WHAT MY RATINGS REWARD');
    const sec=(t,l)=>{if(l.length)L.push(t+': '+fmt(l));};
    sec('Themes',rankedFeatures(tv,'k',12));
    sec('Directors',rankedFeatures(tv,'d',6));
    sec('Writers',rankedFeatures(tv,'w',6));
    sec('Cinematographers',rankedFeatures(tv,'f',4));
    sec('Composers',rankedFeatures(tv,'m',4));
    sec('Actors',rankedFeatures(tv,'c',8));
    sec('Shape',rankedFeatures(tv,'x',5));
    L.push('');L.push('WHAT DRAGS A SCORE DOWN');
    L.push(fmt(rankedFeatures(tv,'k',8,true).concat(rankedFeatures(tv,'x',3,true)))||'(nothing yet)');
  }
  const subAvg={};
  SUBS.forEach(function(x){
    const k=x[0],vals=rated.filter(m=>m.sub&&m.sub[k]!=null).map(m=>m.sub[k]);
    if(vals.length)subAvg[x[1]]=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+' (n='+vals.length+')';
  });
  if(Object.keys(subAvg).length){
    L.push('');L.push('HOW I SCORE THE PARTS');
    for(const k in subAvg)L.push('  '+k+': '+subAvg[k]);
  }
  const tally={};
  rated.forEach(m=>(m.tags||[]).forEach(t=>tally[t]=(tally[t]||0)+1));
  const tags=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(tags.length){
    L.push('');L.push('MY OWN WORDS (reaction tags)');
    L.push(tags.map(([t,n])=>t+' x'+n).join(', '));
  }
  const line=m=>'  '+m.rating+'/10  '+m.title+(m.year?' ('+m.year+')':'')+
    (m.sub&&Object.keys(m.sub).length?'  ['+SUBS.filter(x=>m.sub[x[0]]!=null)
      .map(x=>x[1].toLowerCase()+' '+m.sub[x[0]]).join(', ')+']':'')+
    ((m.tags&&m.tags.length)?'  {'+m.tags.join(', ')+'}':'')+
    ((m.note||'').trim()?'  - "'+m.note.trim()+'"':'');
  if(rated.length){
    L.push('');L.push('HIGHEST');
    rated.slice(0,25).forEach(m=>L.push(line(m)));
    L.push('');L.push('LOWEST - the most informative ratings I have given');
    rated.slice(-15).reverse().forEach(m=>L.push(line(m)));
  }
  const noted=rated.filter(m=>(m.note||'').trim()).slice(0,30);
  if(noted.length){
    L.push('');L.push('EVERYTHING I WROTE A NOTE ON');
    noted.forEach(m=>L.push(line(m)));
  }
  L.push('');L.push('Ask me about any of these and suggest what to watch next.');
  return L.join('\n');
}
function copyBriefing(){
  const txt=buildBriefing();
  const done=()=>toast('Briefing copied - paste it into your chat 💬');
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>showBriefing(txt));
  else showBriefing(txt);
  const box=$('#briefBox');
  if(box)box.value=txt;
}
function showBriefing(txt){
  const box=$('#briefBox');
  if(box){box.value=txt;box.style.display='block';box.select();toast('Select and copy the text below');}
}

function exportBackup(){
  const data={settings:{region:state.settings.region},movies:state.movies,skips:state.skips,scale10:state.scale10};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='marquee-backup-'+todayStr()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function importBackup(e){
  const f=e.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.movies)throw 0;
      state.movies=d.movies;
      state.skips=d.skips||{};
      state.scale10=!!d.scale10;
      migrateScale();
      if(d.settings&&d.settings.region)state.settings.region=d.settings.region;
      save();
      toast('Backup restored — '+Object.keys(state.movies).length+' movies');
      render();
    }catch(err){toast('That file doesn’t look like a Marquee backup');}
  };
  rd.readAsText(f);
}

  const prev=state.settings.apiKey;
  state.settings.apiKey=key;
  try{
    await api('/genre/movie/list',{});
    save();
    toast('You’re in! 🎬');
    setTab('tonight');
  }catch(e){
    state.settings.apiKey=prev;
    toast(e.message);
  }
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act,id=+el.dataset.id||null;
  if(act==='open'){openModal(id);return;}
  if(act==='closeModal'){closeModal();return;}
  if(act==='saveKey'){saveKeyFlow();return;}
  if(act==='reshuffle'){shuffleBump++;render();return;}
  if(act==='shelfFilter'){shelfFilter=el.dataset.val;renderShelf($('#view'));return;}
  if(act==='loadSeed'){loadSeed();return;}
  if(act==='loadRatings'){loadRatings();return;}
  if(act==='study'){studyRatings();return;}
  if(act==='sub'){
    const r=record(id);if(!r)return;
    const k=el.dataset.k,val=+el.dataset.val;
    r.sub=r.sub||{};
    if(r.sub[k]===val)delete r.sub[k];else r.sub[k]=val;
    touch(r);
    if(modalId===id)renderModal();
    return;
  }
  if(act==='tag'){
    const r=record(id);if(!r)return;
    const t=el.dataset.t;
    r.tags=r.tags||[];
    const i=r.tags.indexOf(t);
    if(i>=0)r.tags.splice(i,1);else r.tags.push(t);
    touch(r);
    if(modalId===id)renderModal();
    return;
  }
  if(act==='briefing'){copyBriefing();return;}
  if(act==='bulkMatch'){bulkMatch();return;}
  if(act==='bulkAdd'){bulkAdd();return;}
  if(act==='export'){exportBackup();return;}
  if(act==='wipe'){
    if(confirm('Erase ALL your ratings, owned movies and settings from this browser? This cannot be undone.')){
      localStorage.removeItem(LS_KEY);
      state={settings:{apiKey:'',region:'US'},movies:{},skips:{},cache:{},seedDone:false,seedMissed:[],scale10:true,ratingsDone:false,facts:{},names:{}};
      render();toast('All data erased');
    }
    return;
  }
  if(act==='rate'){
    const r=record(id);
    if(!r){toast('Hmm, open the movie and try again');return;}
    const val=+el.dataset.val;
    r.rating=(r.rating===val)?null:val;   // tap same star again to clear
    touch(r);
    if(r.rating!=null)studySoon(id);   // learn from it immediately, not when asked
    if(r.rating!=null)toast(r.rating>=8?r.rating+'/10 — got it, more like this coming!':r.rating+'/10 — noted');
    else toast('Rating cleared');
    if(modalId===id)renderModal();
    refreshCard(id);
    return;
  }
  if(act==='own'){
    const r=record(id);if(!r)return;
    r.owned=!r.owned;
    if(!r.owned)r.stores=[];
    touch(r);
    toast(r.owned?'Added to your collection 📀':'Removed from your collection');
    if(modalId===id)renderModal();
    refreshCard(id);
    return;
  }
  if(act==='watch'){
    const r=record(id);if(!r)return;
    r.watchlist=!r.watchlist;
    touch(r);
    toast(r.watchlist?'Saved for later \ud83d\udd16':'Removed from watchlist');
    if(modalId===id){renderModal();refreshCard(id);return;}
    // saving it settles the card, so clear it out of a suggestion row and refill behind
    const card=el.closest('.card');
    if(r.watchlist&&card&&card.dataset.sec)removeCard(id);
    else refreshCard(id);
    return;
  }
  if(act==='dismiss'){
    const r=record(id);if(!r)return;
    r.dismissed=!r.dismissed;
    touch(r);
    toast(r.dismissed?'Got it — I won’t suggest that one again':'Okay, back in the mix');
    if(modalId===id)renderModal();else removeCard(id);
    return;
  }
  if(act==='skip'){
    state.skips[id]=Date.now();
    saveSoon();
    removeCard(id);
    return;
  }
  if(act==='saveNote'){
    const r=record(id);if(!r)return;
    r.note=($('#noteBox')&&$('#noteBox').value||'').trim();
    touch(r);
    toast('Note saved ✍️');
    return;
  }
});
document.addEventListener('change',e=>{
  const ep=e.target.closest('[data-act="eraPref"]');
  if(ep){
    state.settings.eraPref=ep.value;
    save();
    toast(ep.value==='rarely'?'Pre-1980 films: classics only':
      ep.value==='freely'?'No era preference':'Pre-1980 films will show up sometimes');
    return;
  }
  const lp=e.target.closest('[data-act="langPref"]');
  if(lp){
    state.settings.langPref=lp.value;
    save();
    toast(lp.value==='rarely'?'Foreign films will show up rarely':
      lp.value==='freely'?'No language preference':'Foreign films will show up sometimes');
    return;
  }
  const os=e.target.closest('[data-act="ownedSignal"]');
  if(os){
    state.settings.ownedSignal=os.checked;
    save();
    toast(os.checked?'Collection counts as a hint again':'Picks now use your ratings only');
    return;
  }
  const el=e.target.closest('[data-act="store"]');
  if(!el)return;
  const r=record(+el.dataset.id);
  if(!r)return;
  const s=el.dataset.store;
  if(el.checked){if(!r.stores.includes(s))r.stores.push(s);}
  else r.stores=r.stores.filter(x=>x!==s);
  touch(r);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalId!=null)closeModal();});
window.addEventListener('pagehide',()=>{if(dirty)save();});
document.addEventListener('visibilitychange',()=>{if(dirty&&document.visibilityState==='hidden')save();});
function refreshCard(id){
  document.querySelectorAll('.card[data-cid="'+id+'"]').forEach(c=>{
    const m=known.get(id)||getRec(id);
    if(!m)return;
    const src=m.title!==undefined&&m.release_date!==undefined?m:{id:m.id,title:m.title,release_date:m.year?m.year+'-01-01':'',poster_path:m.poster,vote_average:m.vote,genre_ids:m.genres};
    const sk=c.querySelector('.chip[data-act="skip"]');
    const wrap=document.createElement('div');
    wrap.innerHTML=cardHTML(src,{skip:!!sk,dismiss:!!c.querySelector('[data-act="dismiss"]'),
      skipLabel:sk?sk.textContent:undefined});
    const nc=wrap.firstChild;
    if(c.dataset.sec)nc.dataset.sec=c.dataset.sec;
    c.replaceWith(nc);
  });
}
const SHOW={'#secPicks':6,'#secGems':3,'#secNew':6,'#secRate':8};
const reserve={};
// clearing a card shouldn't leave a hole - slide the next candidate in behind it
function refill(sel){
  const r=reserve[sel];
  if(!r||!r.items.length)return;
  const host=$(sel);if(!host)return;
  const grid=host.querySelector('.grid');if(!grid)return;
  const m=r.items.shift();
  const wrap=document.createElement('div');
  wrap.innerHTML=cardHTML(m,r.opts);
  const card=wrap.firstChild;
  card.dataset.sec=sel;card.style.opacity='0';
  grid.appendChild(card);
  requestAnimationFrame(()=>{card.style.transition='opacity .3s';card.style.opacity='1';});
}
function removeCard(id){
  document.querySelectorAll('.card[data-cid="'+id+'"]').forEach(c=>{
    const sec=c.dataset.sec;
    c.style.opacity='0';c.style.transition='opacity .25s';
    setTimeout(()=>{c.remove();if(sec)refill(sec);},250);
  });
}

/* ============ nav & boot ============ */
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
load();
if(!state.settings.apiKey)tab='tonight'; // shows setup hero
render();
// every rating should inform the engine without being asked
if(state.settings.apiKey)setTimeout(()=>{if(needsStudy())studyRatings();},1200);
</script>
