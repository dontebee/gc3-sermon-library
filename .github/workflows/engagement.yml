name: Engagement nudges and weekly digest

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14:00 UTC (about 8am Central) so journey
                           # steps (day 0, 5, 30, 90) land on time; the digest
                           # itself only goes out on Mondays
  workflow_dispatch:
    inputs:
      dry_run:
        # Defaults ON for manual runs. A hand-triggered run is almost always
        # someone checking whether the job works, and the cost of guessing
        # wrong is real mail to real people — on 2026-08-05 a manual run sent
        # 30 monthly-giving invitations that nobody meant to send. Untick it
        # deliberately to send for real. The nightly schedule is unaffected:
        # inputs do not apply to it, so scheduled runs stay live.
        description: 'Dry run (print emails instead of sending). Untick to send for real.'
        type: boolean
        default: true
      force_digest:
        description: 'Send the digest even if today is not Monday'
        type: boolean
        default: true
      backfill_per_run:
        # The nightly default of 350 is deliberately gentle. A measured run
        # does ~350 lookups in 100 seconds, so clearing the whole backlog is
        # about fifteen minutes - raise this on a manual run to catch up in
        # one go rather than over a week of nights.
        description: 'Donor name/email lookups this run (blank = 350)'
        type: string
        default: ''

jobs:
  engagement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engagement job
        env:
          # Four spellings, two values, one Supabase project. gc3_env.py picks
          # whichever is set, preferring the intranet's names, so Doppler only
          # has to hold one of each.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          # Doppler's GitHub sync writes Actions *secrets*, never *variables*,
          # so read the secret first and keep vars as the fallback for anything
          # still set by hand.
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          NUDGE_FROM: ${{ secrets.NUDGE_FROM || vars.NUDGE_FROM }}
          REPLY_TO: ${{ secrets.REPLY_TO || vars.REPLY_TO }}
          # Set the SKIP_MONTHLY_NUDGE repository variable to 1 to pause the
          # monthly invitation without silencing celebrations and welcomes.
          SKIP_MONTHLY_NUDGE: ${{ vars.SKIP_MONTHLY_NUDGE }}
          BACKFILL_PER_RUN: ${{ inputs.backfill_per_run }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: python engagement_nudges.py
