name: Meta lead mirror

on:
  schedule:
    - cron: '*/15 * * * *'  # every quarter hour. A guest who raises a hand
                            # on Facebook should be a card on the Board in
                            # minutes, not tomorrow: speed to first touch is
                            # the one thing the follow-up vendors sell that
                            # the house did not already have. Meta reads are
                            # cheap at church scale, and when there is
                            # nothing new the run touches nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        # Defaults ON for manual runs, per house rule (see CLAUDE.md). Read
        # -only against Meta either way; dry run also skips the Supabase
        # writes. Untick it deliberately to mirror for real. The schedule is
        # unaffected: inputs do not apply to it.
        description: 'Dry run (fetch and count, write nothing). Untick to mirror for real.'
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Lead content goes to Supabase and nowhere else. This job prints
      # counts only, and there is deliberately NO artifact upload step:
      # names, emails and phone numbers must never land in logs or
      # downloadable artifacts.
      - name: Mirror instant-form leads
        env:
          # Four spellings, two values, one Supabase project. gc3_env.py picks
          # whichever is set, preferring the intranet's names, so Doppler only
          # has to hold one of each.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Needs more than ads_read: leads_retrieval, pages_show_list,
          # pages_read_engagement and pages_manage_ads, plus the Page
          # assigned to the system user. Until then the job prints setup
          # instructions and exits cleanly.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python meta_leads_rescue.py

      # The fast lane. The mirror leaves .new_leads only when this run found
      # leads it had never seen, and only then is the full resolver worth
      # running: it boards the new arrivals and places their cards, and the
      # board is current within the quarter hour. The nightly 11:00 resolve
      # stays as the full backstop pass.
      - name: Board the new arrivals
        if: ${{ hashFiles('.new_leads') != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pursuit_resolve.py
